<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wedding Invitation</title>
<!-- These show up when you share the link on WhatsApp / Facebook -->
<meta name="description" content="You're invited to our wedding. Tap to open your invitation.">
<meta property="og:title" content="You're invited to our wedding">
<meta property="og:description" content="Tap to open your invitation.">
<!-- Optional preview photo: upload cover.jpg to the repo, then uncomment and fix the link -->
<!-- <meta property="og:image" content="https://YOUR-USERNAME.github.io/wedding/cover.jpg"> -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;1,400&family=Marcellus&family=Noto+Serif+Sinhala:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F8F3;
    --peacock:#0E4D4A;
    --peacock-deep:#08302E;
    --brass:#B8893B;
    --brass-light:#E2C58A;
    --ink:#1F2A28;
    --muted:#56645F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Alegreya",Georgia,"Times New Roman",serif;
    font-size:1.125rem;line-height:1.7;color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body.locked{overflow:hidden}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--brass);outline-offset:4px}

  /* ---------- Cover (the "envelope") ---------- */
  .cover{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;
    padding:calc(2rem + env(safe-area-inset-top,0px)) 2rem 2rem;text-align:center;
    background:var(--peacock-deep);color:var(--paper);
    transition:transform 1.1s cubic-bezier(.7,0,.2,1);
  }
  .cover::before{
    content:"";position:absolute;inset:14px;pointer-events:none;
    border:1px solid rgba(226,197,138,.4);border-radius:8px;
  }
  .cover.open{transform:translateY(-100%)}
  .cover .dear{font-size:1.15rem;font-style:italic;color:var(--brass-light)}
  .cover h1{font-family:"Marcellus",Georgia,serif;font-weight:400;font-size:clamp(2.1rem,8vw,3.4rem);line-height:1.15}
  .seal{width:120px;height:120px}
  .open-btn{
    font:inherit;font-size:1.05rem;cursor:pointer;
    background:var(--brass);color:var(--peacock-deep);
    border:0;border-radius:999px;padding:.8rem 2.2rem;margin-top:.5rem;
  }
  .open-btn:hover{background:var(--brass-light)}

  /* ---------- Invitation ---------- */
  main{max-width:34rem;margin:0 auto;padding:calc(4rem + env(safe-area-inset-top,0px)) 1.5rem 3rem;text-align:center}
  .sinhala{font-family:"Noto Serif Sinhala",serif;color:var(--peacock);font-size:1.2rem;line-height:1.9}
  .families{color:var(--muted);margin-top:1.25rem}
  .names{
    font-family:"Marcellus",Georgia,serif;font-weight:400;color:var(--peacock);
    font-size:clamp(2.8rem,13vw,4.6rem);line-height:1.05;margin:1.25rem 0 1rem;
  }
  .names span{display:block;font-family:"Alegreya",serif;font-style:italic;font-size:.42em;color:var(--brass);margin:.4rem 0}
  .ask{color:var(--muted)}

  .date{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.1rem;
    margin:2.5rem 0 .75rem;font-family:"Marcellus",serif;color:var(--peacock);
  }
  .date .side{border-block:1px solid var(--brass);padding:.35rem 0;font-size:1.05rem}
  .date .day{font-size:3.6rem;line-height:1}
  .countdown{font-style:italic;color:var(--brass)}

  .divider{width:72px;height:36px;margin:2.75rem auto}

  h2{font-family:"Marcellus",Georgia,serif;font-weight:400;color:var(--peacock);font-size:1.6rem;margin-bottom:1rem}
  .events{list-style:none;max-width:22rem;margin:0 auto}
  .events li{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:1px dotted rgba(14,77,74,.35)}
  .events li:last-child{border-bottom:0}
  .events time{color:var(--muted);white-space:nowrap}

  .venue-name{font-size:1.25rem;font-weight:500}
  .venue-addr{color:var(--muted);margin-bottom:1.25rem}

  .btn{
    display:inline-block;text-decoration:none;font-size:1rem;
    padding:.75rem 1.6rem;border-radius:999px;margin:.35rem;
    border:1px solid var(--peacock);color:var(--peacock);
  }
  .btn:hover{background:rgba(14,77,74,.07)}
  .btn.solid{background:var(--peacock);color:var(--paper)}
  .btn.solid:hover{background:var(--peacock-deep)}

  footer{margin-top:3.5rem;color:var(--muted)}
  footer .sign{font-family:"Marcellus",serif;color:var(--peacock);font-size:1.3rem;margin-top:.25rem}

  @media (prefers-reduced-motion:reduce){.cover{transition:none}}
</style>
</head>
<body class="locked">

<!-- Lotus shape, reused as the seal and the dividers -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="lotus" viewBox="0 0 100 50">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M50 4 C41 16 41 34 50 46 C59 34 59 16 50 4Z"/>
      <path d="M50 46 C40 40 30 30 28 16 C38 20 46 30 50 46Z"/>
      <path d="M50 46 C60 40 70 30 72 16 C62 20 54 30 50 46Z"/>
      <path d="M50 46 C36 46 20 40 12 28 C26 28 40 36 50 46Z"/>
      <path d="M50 46 C64 46 80 40 88 28 C74 28 60 36 50 46Z"/>
      <path d="M8 47 H92"/>
    </g>
  </symbol>
</svg>

<section class="cover" id="cover">
  <svg class="seal" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="56" fill="var(--brass)"/>
    <circle cx="60" cy="60" r="49" fill="none" stroke="var(--peacock-deep)" stroke-width="1" opacity=".5"/>
    <use href="#lotus" x="25" y="38" width="70" height="35" style="color:var(--peacock-deep)"/>
  </svg>
  <p class="dear" id="dear">Dear guest,</p>
  <h1 id="coverNames"></h1>
  <button class="open-btn" id="openBtn">Open invitation</button>
</section>

<main id="invite" aria-hidden="true">
  <p class="sinhala" id="sinhala"></p>
  <p class="families" id="families"></p>
  <h1 class="names" id="names" tabindex="-1"></h1>
  <p class="ask">request the pleasure of your company<br>as we begin our life together</p>

  <div class="date" aria-label="Wedding date">
    <div class="side" id="weekday"></div>
    <div class="day" id="day"></div>
    <div class="side" id="monthYear"></div>
  </div>
  <p class="countdown" id="countdown"></p>

  <svg class="divider" aria-hidden="true" style="color:var(--brass)"><use href="#lotus"/></svg>

  <h2>The day</h2>
  <ul class="events" id="events"></ul>

  <svg class="divider" aria-hidden="true" style="color:var(--brass)"><use href="#lotus"/></svg>

  <h2>Where</h2>
  <p class="venue-name" id="venueName"></p>
  <p class="venue-addr" id="venueAddr"></p>
  <a class="btn" id="mapBtn" target="_blank" rel="noopener">Open in Google Maps</a>
  <a class="btn" id="calBtn" target="_blank" rel="noopener">Add to calendar</a>

  <svg class="divider" aria-hidden="true" style="color:var(--brass)"><use href="#lotus"/></svg>

  <h2>Will you join us?</h2>
  <p class="venue-addr" id="rsvpBy"></p>
  <a class="btn solid" id="rsvpBtn" target="_blank" rel="noopener">Reply on WhatsApp</a>
  <a class="btn" id="formBtn" target="_blank" rel="noopener" hidden>Reply with the form</a>

  <footer>
    <p>With love,</p>
    <p class="sign" id="sign"></p>
  </footer>
</main>

<script>
/* =========================================================
   EDIT EVERYTHING HERE — you don't need to touch anything else
   ========================================================= */
const CONFIG = {
  name1: "Tushara",
  name2: "Partner's Name",
  families: "Together with their families",
  sinhalaGreeting: "ඔබට සාදරයෙන් ආරාධනා කරමු",   // leave "" to hide

  // Start and end of the day, Sri Lanka time (+05:30)
  start: "2027-02-14T09:30:00+05:30",
  end:   "2027-02-14T16:30:00+05:30",

  events: [
    { title: "Poruwa ceremony",      time: "9.30 am" },
    { title: "Lunch and reception",  time: "12.00 noon" },
    { title: "Going away",           time: "4.00 pm" }
  ],

  venueName: "Hotel Name",
  venueAddress: "Street, City",
  mapsLink: "https://maps.google.com/?q=Kandy",   // paste the share link from Google Maps

  rsvpBy: "31 January 2027",
  whatsappNumber: "94771234567",   // country code + number, no + or spaces
  rsvpFormLink: ""                 // optional Google Form link, leave "" to hide
};
/* ========================================================= */

const $ = id => document.getElementById(id);
const couple = `${CONFIG.name1} & ${CONFIG.name2}`;
const start = new Date(CONFIG.start), end = new Date(CONFIG.end);
const fmt = opts => start.toLocaleDateString("en-GB", { timeZone: "Asia/Colombo", ...opts });

// Personal greeting: share links like .../?to=Nimal%20and%20family
const guest = new URLSearchParams(location.search).get("to");
if (guest) $("dear").textContent = `Dear ${guest},`;

document.title = `${couple} — Wedding Invitation`;
$("coverNames").textContent = couple;
$("sinhala").textContent = CONFIG.sinhalaGreeting;
$("families").textContent = CONFIG.families;
$("names").innerHTML = "";
$("names").append(CONFIG.name1, Object.assign(document.createElement("span"), { textContent: "&" }), CONFIG.name2);
$("weekday").textContent = fmt({ weekday: "long" });
$("day").textContent = fmt({ day: "numeric" });
$("monthYear").textContent = fmt({ month: "long", year: "numeric" });

$("events").innerHTML = CONFIG.events
  .map(e => `<li><span>${e.title}</span><time>${e.time}</time></li>`).join("");

$("venueName").textContent = CONFIG.venueName;
$("venueAddr").textContent = CONFIG.venueAddress;
$("mapBtn").href = CONFIG.mapsLink;

const gcal = d => d.toISOString().replace(/[-:]|\.\d{3}/g, "");
$("calBtn").href = "https://calendar.google.com/calendar/render?action=TEMPLATE" +
  `&text=${encodeURIComponent(couple + "'s wedding")}` +
  `&dates=${gcal(start)}/${gcal(end)}` +
  `&location=${encodeURIComponent(CONFIG.venueName + ", " + CONFIG.venueAddress)}`;

$("rsvpBy").textContent = `Please let us know by ${CONFIG.rsvpBy}.`;
$("rsvpBtn").href = `https://wa.me/${CONFIG.whatsappNumber}?text=` +
  encodeURIComponent(`Hi! Replying to ${couple}'s wedding invitation: we'll be there. Number of guests: `);
if (CONFIG.rsvpFormLink) { $("formBtn").href = CONFIG.rsvpFormLink; $("formBtn").hidden = false; }
$("sign").textContent = couple;

// Countdown
const days = Math.ceil((start - new Date()) / 86400000);
$("countdown").textContent =
  days > 1 ? `${days} days to go` :
  days === 1 ? "Tomorrow!" :
  new Date() < end ? "Today's the day" : "Thank you for celebrating with us";

// Open the envelope
$("openBtn").addEventListener("click", () => {
  $("cover").classList.add("open");
  document.body.classList.remove("locked");
  $("invite").removeAttribute("aria-hidden");
  $("names").focus({ preventScroll: true });
  setTimeout(() => { $("cover").hidden = true; }, 1200);
});
</script>
</body>
</html>
